# Local services for the API.
#   docker compose up -d redis         services only, then `pnpm dev:api` on the host
#   docker compose --profile api up    also builds and runs the API image (production mode)
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Development inbox: the API sends account e-mails here (SMTP on 1025) and you read them at
  # http://localhost:8025. Nothing leaves your machine.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bordo
      POSTGRES_PASSWORD: bordo
      POSTGRES_DB: bordo
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bordo -d bordo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot deploy step: applies the SQL migrations, then exits.
  migrate:
    profiles: ["api"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/database/migrate.js"]
    environment:
      DATABASE_URL: postgres://bordo:bordo@postgres:5432/bordo
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - api-storage:/app/storage
    environment:
      PORT: "3001"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://bordo:bordo@postgres:5432/bordo
      STORAGE_LOCAL_DIR: /app/storage
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  api-storage:
