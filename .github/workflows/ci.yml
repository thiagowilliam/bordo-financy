name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The API integration tests run against a real Postgres.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bordo
          POSTGRES_PASSWORD: bordo
          POSTGRES_DB: bordo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bordo -d bordo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # The mail queue tests run against a real Redis.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          # A missing database or Redis must fail the run here, not skip the tests.
          REQUIRE_DATABASE: "1"
      - run: pnpm build

  api-image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
